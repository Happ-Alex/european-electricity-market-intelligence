project:
  timezone: UTC
  start_date: '2025-01-01'
  end_date: '2025-01-03'

zones:
  DE_LU:
    eic: 10Y1001A1001A82H
    weather:
      latitude: 52.5200
      longitude: 13.4050
  FR:
    eic: 10YFR-RTE------C
    weather:
      latitude: 48.8566
      longitude: 2.3522
  BE:
    eic: 10YBE----------2
    weather:
      latitude: 50.8503
      longitude: 4.3517
  NL:
    eic: 10YNL----------L
    weather:
      latitude: 52.3676
      longitude: 4.9041
  PL:
    eic: 10YPL-AREA-----S
    weather:
      latitude: 52.2297
      longitude: 21.0122
  CZ:
    eic: 10YCZ-CEPS-----N
    weather:
      latitude: 50.0755
      longitude: 14.4378

borders:
  - [DE_LU, FR]
  - [DE_LU, BE]
  - [DE_LU, NL]
  - [DE_LU, PL]
  - [DE_LU, CZ]
  - [FR, BE]
  - [BE, NL]

entsoe:
  # Long historical requests frequently hit ENTSO-E response-size limits.
  # The chunked backfill uses these bounded windows from the start instead of
  # requesting a whole year and recursively retrying it.
  chunk_days: 14
  datasets:
    day_ahead_prices:
      documentType: A44
      contract_MarketAgreement.Type: A01
      domain_params: [in_Domain, out_Domain]
      # DE-LU publishes multiple day-ahead price sequences. Sequence 1 is the
      # SDAC series used for the market price in this project.
      domain_overrides:
        10Y1001A1001A82H:
          classificationSequence_AttributeInstanceComponent.position: 1
      scope: zone
      required: true
      chunk_days: 31
    actual_load:
      documentType: A65
      processType: A16
      domain_params: [outBiddingZone_Domain]
      scope: zone
      required: true
      chunk_days: 14
    day_ahead_load_forecast:
      documentType: A65
      processType: A01
      domain_params: [outBiddingZone_Domain]
      scope: zone
      required: true
      chunk_days: 14
    actual_generation_per_type:
      documentType: A75
      processType: A16
      domain_params: [in_Domain]
      scope: zone
      required: true
      chunk_days: 7
    day_ahead_generation_forecast:
      documentType: A71
      processType: A01
      domain_params: [in_Domain]
      scope: zone
      required: true
      chunk_days: 14
    wind_solar_forecast:
      documentType: A69
      processType: A01
      domain_params: [in_Domain]
      scope: zone
      required: true
      chunk_days: 14
    physical_flows:
      documentType: A11
      scope: border
      required: true
      chunk_days: 31
    scheduled_exchanges:
      documentType: A09
      contract_MarketAgreement.Type: A01
      scope: border
      required: true
      chunk_days: 31
    transfer_capacity:
      documentType: A61
      contract_MarketAgreement.Type: A01
      scope: border
      required: false
      chunk_days: 31

jao:
  # Endpoint paths are configurable because JAO periodically changes routing.
  # Validate these paths in the Core API explorer before a long backfill.
  endpoints:
    max_exchanges: maxExchanges
    max_net_positions: maxNetPos
    final_computation: finalComputation
  request_params:
    # The client automatically adds from/to in ISO-8601 form.
    page: 0
    size: 10000

weather:
  base_url: https://archive-api.open-meteo.com/v1/archive
  hourly:
    - temperature_2m
    - wind_speed_10m
    - wind_speed_100m
    - cloud_cover
    - shortwave_radiation
