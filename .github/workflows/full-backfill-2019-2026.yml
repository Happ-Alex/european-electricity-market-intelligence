name: Full public backfill 2019-2026

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/backfill_public_data.py'
      - '.github/workflows/full-backfill-2019-2026.yml'

permissions:
  contents: write
  actions: read

jobs:
  backfill:
    name: Backfill ${{ matrix.year }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        year: [2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas pyarrow requests

      - name: Download and process year
        run: python scripts/backfill_public_data.py --year ${{ matrix.year }}

      - name: Package yearly dataset
        run: |
          cd data/backfill/${{ matrix.year }}
          zip -r ../../../electricity-data-${{ matrix.year }}.zip .

      - name: Upload yearly artifact
        uses: actions/upload-artifact@v4
        with:
          name: electricity-data-${{ matrix.year }}
          path: electricity-data-${{ matrix.year }}.zip
          retention-days: 90
          compression-level: 0

  publish:
    name: Publish persistent data release
    needs: backfill
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download completed yearly artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: electricity-data-*
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: find release-assets -maxdepth 2 -type f -print

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="data-2019-2026-v1"
          cat > RELEASE_NOTES.md <<'EOF'
          # European Electricity Market Intelligence — public dataset 2019–2026

          Persistent yearly data packages generated by the repository ETL.

          ## Included
          - Day-ahead electricity prices from SMARD / Bundesnetzagentur
          - Public generation and load from Fraunhofer Energy-Charts
          - Scheduled cross-border commercial exchanges from Energy-Charts (`cbet`)
          - Cross-border physical flows from Energy-Charts (`cbpf`)
          - Historical weather from Open-Meteo
          - Hourly processed market table for the six selected zones
          - Hourly border table with price spreads and available bilateral flow series
          - Per-year extraction manifest with source-level row counts and failures

          ## Geography
          DE-LU, FR, BE, NL, PL, CZ.

          ## Period
          2019-01-01 through the latest completed day in 2026 at generation time.

          ## File formats
          Each yearly ZIP contains raw Parquet files plus processed Parquet and gzip-compressed CSV files.

          ## Important limitations
          This public release intentionally does not redistribute restricted Energy-Charts price series. Price data is sourced from SMARD instead. ENTSO-E token-based extracts and JAO flow-based capacity/constraint data are not part of this public-source backfill yet and can be layered in later.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Electricity market dataset 2019-2026" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" --title "Electricity market dataset 2019-2026" --notes-file RELEASE_NOTES.md
          fi

          shopt -s nullglob
          assets=(release-assets/*.zip)
          if [ ${#assets[@]} -gt 0 ]; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            echo "No yearly ZIP files were available to publish."
          fi
