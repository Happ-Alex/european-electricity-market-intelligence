name: ENTSO-E token smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/entsoe-smoke-test.yml'
      - 'scripts/test_entsoe_access.py'

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENTSOE_SECURITY_TOKEN: ${{ secrets.ENTSOE_SECURITY_TOKEN }}
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test ENTSO-E API access
        run: python scripts/test_entsoe_access.py
